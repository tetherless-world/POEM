@()

<div class="theme-controls d-flex align-items-center gap-2 ms-lg-3 py-2">
    <div class="form-check form-switch mb-0">
        <input class="form-check-input" type="checkbox" role="switch" id="theme-switch"
            aria-describedby="theme-status">
        <label class="form-check-label text-nowrap" for="theme-switch">Dark mode</label>
    </div>
    <button class="btn btn-sm btn-outline-secondary text-nowrap" type="button" id="theme-system">
        Use system
    </button>
    <span class="visually-hidden" id="theme-status" aria-live="polite"></span>
</div>
